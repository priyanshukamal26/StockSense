name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: stocksense_dev
          POSTGRES_DB: stocksense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Prisma migrate (test schema)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://stocksense:stocksense_dev@localhost:5432/stocksense_test
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://stocksense:stocksense_dev@localhost:5432/stocksense_test
          JWT_SECRET: ci_test_secret_at_least_32_chars_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_32chars
          NODE_ENV: test

  frontend:
    name: Frontend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
